<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockDash | Real-Time Market Overview</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow top-left"></div>
    <div class="background-glow bottom-right"></div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">📈</span>
                <div>
                    <h1>EquityView</h1>
                    <small>Stocks & vibes</small>
                </div>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by symbol (e.g., AAPL)..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>
        </header>

        <div class="controls-bar">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="ALL">All Stocks</button>
                <button class="filter-btn" data-filter="PROFIT">Gainers</button>
                <button class="filter-btn" data-filter="LOSS">Losers</button>
            </div>
            
            <div class="sort-group">
                <label for="sortSelect">Sort By:</label>
                <select id="sortSelect">
                    <option value="DEFAULT">Default</option>
                    <option value="PRICE_ASC">Price: Low to High</option>
                    <option value="PRICE_DESC">Price: High to Low</option>
                </select>
            </div>
        </div>

        <main>
            <div id="loader" class="loader-container hidden">
                <div class="shimmer-card"></div>
                <div class="shimmer-card"></div>
                <div class="shimmer-card"></div>
                <div class="shimmer-card"></div>
            </div>

            <div id="stockGrid" class="stock-grid">
                <!-- Stock cards will be injected here -->
            </div>

            <div id="noResults" class="no-results hidden">
                <p>No stocks found matching your search.</p>
            </div>
        </main>

        <footer>
            <p>Data provided by Finnhub API.</p>
        </footer>
    </div>
    <script src="app.js?v=2"></script>
</body>
</html>
